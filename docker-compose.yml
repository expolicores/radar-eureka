# Ambiente local de R0: solo PostgreSQL 16.
# Las credenciales son de ejemplo para desarrollo local; nunca se usan fuera de esta máquina.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: procurement
      POSTGRES_PASSWORD: procurement_local
      POSTGRES_DB: public_procurement
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurement -d public_procurement"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
